<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mythfolk Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#e3c07a;--ink:#140f0d;--marble:#f3e9dc;--g:#3fbf7f;--y:#e5b83c;--r:#e0524d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--marble);font:600 17px/1.5 'Cormorant Garamond',Georgia,serif;overflow-x:hidden}
.bg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:0;animation:fade 40s infinite,drift 40s infinite linear;z-index:-3}
.bg.b2{animation-delay:20s}
@keyframes fade{0%{opacity:0}10%,45%{opacity:1}55%,100%{opacity:0}}
@keyframes drift{from{transform:scale(1.05) translateY(0)}to{transform:scale(1.22) translateY(-2%)}}
.veil{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 20%,rgba(20,15,13,.25),rgba(20,15,13,.88) 75%)}
.dust{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.dust i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-110vh) translateX(30px);opacity:0}}
header{padding:38px 18px 8px;text-align:center}
h1{font:700 clamp(28px,7vw,52px)/1.1 Cinzel,serif;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 30px rgba(227,192,122,.35);animation:open 1.6s ease both}
@keyframes open{from{opacity:0;letter-spacing:.35em;filter:blur(8px)}to{opacity:1;letter-spacing:.06em;filter:none}}
.sub{opacity:.8;margin-top:6px;font-size:18px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:14px 16px;backdrop-filter:blur(10px);background:rgba(20,15,13,.55);scrollbar-width:none}
nav button{flex:none;font:600 15px Cinzel,serif;color:var(--marble);background:transparent;border:1px solid rgba(227,192,122,.35);padding:9px 16px;border-radius:99px;cursor:pointer;transition:.3s}
nav button.on{background:var(--gold);color:var(--ink);box-shadow:0 0 22px rgba(227,192,122,.5)}
main{max-width:980px;margin:0 auto;padding:12px 14px 90px}
#view.swap{animation:swap .7s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:3px 12px;border-radius:99px;font-size:15px;border:1px solid;background:rgba(0,0,0,.35)}
.panel{background:rgba(24,17,14,.62);border:1px solid rgba(227,192,122,.25);border-radius:16px;backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;text-align:center;white-space:nowrap}
th{font:500 14px Cinzel,serif;color:var(--gold)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:rgba(24,17,14,.92);z-index:1}
tr{border-top:1px solid rgba(227,192,122,.12)}
.cell{width:42px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:default;transition:.25s}
.admin .cell{cursor:pointer}.admin .cell:hover{transform:scale(1.15)}
.cell[data-s=g]{background:var(--g);border-color:var(--g)}.cell[data-s=y]{background:var(--y);border-color:var(--y);color:#2a1f00}.cell[data-s=r]{background:var(--r);border-color:var(--r)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{padding:16px;border-left:5px solid rgba(255,255,255,.2);transition:.4s;animation:swap .6s both;animation-delay:calc(var(--i)*70ms)}
.card[data-s=g]{border-left-color:var(--g);box-shadow:0 0 30px rgba(63,191,127,.18)}.card[data-s=r]{border-left-color:var(--r);box-shadow:0 0 30px rgba(224,82,77,.15)}.card[data-s=y]{border-left-color:var(--y)}
.card h3{font:700 17px Cinzel,serif;color:var(--gold);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.card ul{list-style:none;padding:0;margin-bottom:12px}
.card .cell{width:100%;font:600 16px 'Cormorant Garamond',serif}
.top{position:fixed;left:14px;bottom:14px;z-index:9;display:flex;gap:8px;align-items:center}
.top button,.add{font:600 14px Cinzel,serif;background:rgba(20,15,13,.8);color:var(--gold);border:1px solid var(--gold);padding:10px 16px;border-radius:99px;cursor:pointer;backdrop-filter:blur(8px)}
.tag{font-size:14px;opacity:.85;background:rgba(20,15,13,.8);padding:6px 12px;border-radius:99px}
dialog{border:1px solid var(--gold);background:#1b1411;color:var(--marble);padding:24px;border-radius:16px;margin:auto;font-family:inherit}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
dialog input{display:block;width:100%;margin:12px 0;padding:10px;border-radius:8px;border:1px solid var(--gold);background:#0e0a09;color:#fff;font:inherit}
.warn{background:rgba(229,184,60,.15);border:1px solid var(--y);padding:8px 14px;border-radius:10px;margin:8px 0;font-size:15px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.bg.b1{opacity:1}}
</style></head><body>

{id:"cm",name:"Concept Map",t:"grp",set:PN,gr:G4},
{id:"cp",name:"Capstone",t:"grp",set:PN,gr:G4}];
const COL={g:"var(--g)",y:"var(--y)",r:"var(--r)"};
let DB={marks:{}},cur="qw",admin=false,live=true,pw=localStorage.getItem("mfpw")||"";
const $=s=>document.querySelector(s);
async function pull(){
 try{const r=await fetch("/api/tracker",{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();live=true;const n={marks:j.marks||{}};if(JSON.stringify(n)!==JSON.stringify(DB)){DB=n;render(true)}}
 catch(e){live=false;const j=JSON.parse(localStorage.getItem("mf")||"null");if(j&&JSON.stringify(j)!==JSON.stringify(DB)){DB=j;render(true)}}
 $("#warn").innerHTML=live?"":'<div class="warn">Preview mode: changes save only in this browser until the site is live on Netlify.</div>'}
async function push(key,val){
 if(!live){localStorage.setItem("mf",JSON.stringify(DB));return}
 try{const r=await fetch("/api/tracker",{method:"POST",body:JSON.stringify({password:pw,key,value:val})});if(!r.ok)throw 0}
 catch(e){alert("Could not save. Please sign in again.");setAdmin(false)}}
function mark(key,set){const c=DB.marks[key];const ks=set.map(s=>s[0]);const i=ks.indexOf(c);const n=i+1>=ks.length?null:ks[i+1];if(n)DB.marks[key]=n;else delete DB.marks[key];push(key,n);render(true)}
function cell(k,set){const s=DB.marks[k];const d=set.find(x=>x[0]===s);return `<button class="cell" data-k="${k}" data-s="${s||""}" title="${d?d[1]:"Not marked"}">${d?d[2]:""}</button>`}
function cellWide(k,set){const s=DB.marks[k];const d=set.find(x=>x[0]===s);return `<button class="cell" data-k="${k}" data-s="${s||""}">${d?d[2]+" "+d[1]:"Not marked"}</button>`}
function render(keep){
 const T=TABS.find(t=>t.id===cur);
 $("#nav").innerHTML=TABS.map(t=>`<button class="${t.id===cur?"on":""}" data-t="${t.id}">${t.name}</button>`).join("");
 document.body.classList.toggle("admin",admin);
 let body="",keys=[];
 if(T.t==="stu"){
  body=`<div class="panel scroll"><table><tr><th>Student</th>${T.cols.map(c=>`<th>${c}</th>`).join("")}</tr>${STU.map(n=>`<tr><td>${n}</td>${T.cols.map((c,i)=>{const k="qw"+i+"_"+n;keys.push(k);return `<td>${cell(k,T.set)}</td>`}).join("")}</tr>`).join("")}</table></div>`}
 else{
  body=`<div class="groups">${T.gr.map((g,i)=>{const k=T.id+"_G"+(i+1);keys.push(k);const s=DB.marks[k]||"";return `<div class="card panel" data-s="${s}" style="--i:${i}"><h3>${T.lbl||"Group"} ${i+1}</h3><ul>${g.map(n=>`<li>${n}</li>`).join("")}</ul>${cellWide(k,T.set)}</div>`}).join("")}</div>`}
 const cnt=T.set.map(s=>`<span class="chip" style="border-color:${COL[s[0]]};color:${COL[s[0]]}">${s[1]}: ${keys.filter(k=>DB.marks[k]===s[0]).length}</span>`).join("");
 $("#view").innerHTML=`<div class="bar"><div class="legend">${cnt}</div></div>`+body;
 if(!keep){$("#view").classList.remove("swap");void $("#view").offsetWidth;$("#view").classList.add("swap")}}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-t]");if(t){cur=t.dataset.t;render();return}
 const c=e.target.closest(".cell");if(c&&admin)mark(c.dataset.k,TABS.find(x=>x.id===cur).set)});
function setAdmin(v){admin=v;$("#tag").textContent=v?"Admin mode":"Viewing";$("#adm").textContent=v?"Sign out":"Admin";render(true)}
async function check(p){try{const r=await fetch("/api/tracker",{method:"POST",body:JSON.stringify({password:p,check:true})});return r.ok}catch(e){return false}}
$("#adm").onclick=()=>{
 if(admin){pw="";localStorage.removeItem("mfpw");setAdmin(false);return}
 if(!live){setAdmin(true);return}
 $("#pw").value="";$("#dlg").showModal()};
$("#dlg").addEventListener("close",async()=>{
 if($("#dlg").returnValue!=="go")return;
 const p=$("#pw").value;
 if(await check(p)){pw=p;localStorage.setItem("mfpw",p);setAdmin(true)}else alert("Wrong password.")});
for(let i=0;i<26;i++){const d=document.createElement("i");d.style.cssText=`left:${Math.random()*100}%;animation-duration:${10+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;$("#dust").appendChild(d)}
pull().then(async()=>{render();if(live&&pw&&await check(pw))setAdmin(true)});
setInterval(()=>{if(!document.hidden)pull()},8000);
</script></body></html>
